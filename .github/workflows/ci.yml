name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests (90% coverage)
    runs-on: pub-hk-ubuntu-24.04-ip
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install "pytest>=8.0" "pytest-cov>=6.0"
      - name: Run unit tests with coverage
        # Interim threshold while PRs 2+3 add stack/preflight tests; target is 90%
        run: python3 scripts/coverage_report.py --target 15

  generator-evals:
    name: Generator Evals (Layer 2 Determinism)
    runs-on: pub-hk-ubuntu-24.04-ip
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run generator evals
        run: python3 -m unittest discover -s evals/generator -v

  container-evals:
    name: Container Evals (Docker Boot Tests)
    runs-on: pub-hk-ubuntu-24.04-ip
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: eval_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run container evals
        run: python3 -m unittest discover -s evals/container -v
        timeout-minutes: 15

  skill-evals:
    name: Skill Evals (LLM Trigger + E2E)
    runs-on: pub-hk-ubuntu-24.04-ip
    if: github.event_name == 'workflow_dispatch'
    env:
      HEROKU_MCP_STUB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run trigger evals
        run: python3 evals/skills/trigger_eval.py
      - name: Run token budget evals
        run: python3 evals/skills/token_budget_eval.py
      - name: Run E2E eval stub mode Python FastAPI
        run: python3 evals/skills/e2e_build_and_deploy.py --stack python
      - name: Run E2E eval stub mode Node
        run: python3 evals/skills/e2e_build_and_deploy.py --stack node
      - name: Run E2E eval stub mode Go
        run: python3 evals/skills/e2e_build_and_deploy.py --stack go
