name: Release on Push

# Runs release-please on every push to main. Two things happen over a release cycle:
# (1) while commits accumulate, it opens/updates the standing Release PR (bumping
# .claude-plugin/plugin.json $.version + CHANGELOG.md); (2) once that PR is merged, the
# next run tags the version (vX.Y.Z) and creates the GitHub Release. Nothing is shipped
# to a package registry — a Claude Code plugin is consumed from the git tag.

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Release PR + tag/release
    runs-on: sfdc-hk-ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v5
        with:
          target-branch: main
          config-file: .github/release-configs/release-please-config.json
          manifest-file: .github/release-configs/release-please-manifest.json
